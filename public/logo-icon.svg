<svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0D2B1F" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#061812" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1AD76F" stop-opacity="0.24"/>
      <stop offset="60%"  stop-color="#1AD76F" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1AD76F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sqG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6AFFCC"/>
      <stop offset="45%"  stop-color="#1AD76F"/>
      <stop offset="100%" stop-color="#08924A"/>
    </linearGradient>
    <filter id="dg" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Glass background -->
  <rect x="0" y="0" width="88" height="88" rx="20"
        fill="url(#glassBg)"
        stroke="#1AD76F" stroke-opacity="0.22" stroke-width="1"/>
  <rect x="1" y="1" width="86" height="44" rx="19"
        fill="url(#shine)"/>

  <!-- Orbital icon centered at (44,44) -->
  <g transform="translate(44,44)">
    <circle r="40" fill="url(#halo)"/>
    <circle r="32" stroke="#1AD76F" stroke-opacity="0.18" stroke-width="1" fill="none"/>
    <circle r="21" stroke="#1AD76F" stroke-opacity="0.3"  stroke-width="1" fill="none"/>
    <circle cx="0"   cy="-32" r="2.8" fill="#26EB82" filter="url(#dg)"/>
    <circle cx="28"  cy="-15" r="2.8" fill="#26EB82" filter="url(#dg)"/>
    <circle cx="-23" cy="23"  r="2.2" fill="#26EB82" fill-opacity="0.72" filter="url(#dg)"/>
    <circle cx="23"  cy="23"  r="2.2" fill="#26EB82" fill-opacity="0.72" filter="url(#dg)"/>
    <rect x="-15" y="-15" width="30" height="30" rx="9"
          fill="url(#sqG)" transform="rotate(8)"
          filter="url(#sg)"/>
  </g>
</svg>
